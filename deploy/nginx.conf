# =============================================================================
# PROXY DEL PORTAFOLIO · sitio estático + API bajo /api
# -----------------------------------------------------------------------------
# Un solo origen: el navegador pide `/api/v1/...` al mismo host que sirve el
# sitio, y nginx lo reenvía al contenedor de la API. Al compartir origen no hay
# peticiones cross-origin, así que CORS no necesita el dominio público.
#
# Las rutas reales de la API ya incluyen el prefijo `/api` (`/api/v1/health/live`,
# `/api/v1/cnbv/...`, `/api/v1/marketing/...`, ...), por eso el proxy reenvía la
# ruta tal cual, sin reescribirla.
# =============================================================================

upstream portfolio_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 4m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;


    # Salud del propio proxy: la usa el healthcheck del contenedor `web`.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://portfolio_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- Artefactos de los tableros ---------------------------------------
    # HTML y recursos con nombres estables: revalidar en cada visita. Si el archivo no existe se
    # responde 404 (nunca el index.html del sitio, que confundiría al navegador).
    # Solo los bundles con hash en el nombre son inmutables.
    location ~* "^/dashboards/.*/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location /dashboards/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    location /img/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
    }

    # ---- Sitio -------------------------------------------------------------
    # El sitio usa rutas con `#`, así que cualquier ruta desconocida se resuelve
    # con el índice; el HTML nunca se cachea.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}
