name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integridad:
    name: Integridad del sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verificar archivos obligatorios
        run: |
          set -eu
          for archivo in dist/index.html dist/config.js dist/app.js dist/content.js dist/style.css \
                         deploy/docker-compose.yml deploy/nginx.conf deploy/Dockerfile.sitio \
                         deploy/.env.example README.md; do
            test -s "$archivo" || { echo "Falta $archivo"; exit 1; }
          done

      - name: Contratos de publicación y evidencia editorial
        run: |
          node --test tools/artefacto-publico.test.mjs
          node tools/generar-evidencia.mjs --check

      - name: Comprobar sintaxis del sitio
        run: |
          set -eu
          node --check dist/app.js
          node --check dist/content.js
          node --check dist/config.js
          echo "Sintaxis correcta"

      - name: Verificar que las cinco categorías estén declaradas
        run: |
          set -eu
          node -e '
          const fs = require("fs"), vm = require("vm");
          const ctx = { window: {} };
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync("dist/content.js", "utf8"), ctx);
          const P = ctx.window.PORTAFOLIO;
          const esperadas = [
            ["01", "dashboards", "Visualización"],
            ["02", "ciencia-de-datos", "Ciencia de datos"],
            ["03", "ingenieria-de-datos", "Ingeniería de datos"],
            ["04", "ia-generativa", "IA generativa"],
            ["05", "agentes", "Agentes"]
          ];
          if (P.areas.length !== 5) throw new Error("se esperaban 5 áreas, hay " + P.areas.length);
          esperadas.forEach(([numero, id, etiqueta], i) => {
            const a = P.areas[i];
            if (a.numero !== numero) throw new Error(`posición ${i + 1}: número ${a.numero}`);
            if (a.id !== id) throw new Error(`posición ${i + 1}: id ${a.id}`);
            if (a.etiqueta !== etiqueta) throw new Error(`área ${id}: etiqueta ${a.etiqueta}`);
            if (!a.proyectos || !a.proyectos.length) throw new Error(`área ${id} sin proyectos`);
            for (const p of a.proyectos) {
              if (!["publicado", "desarrollo", "previsto"].includes(p.estado)) {
                throw new Error(`${id}/${p.id}: estado inválido ${p.estado}`);
              }
              if (p.codigoUrl && !p.codigoUrl.startsWith("https://github.com/")) {
                throw new Error(`${id}/${p.id}: codigoUrl inválida`);
              }
            }
          });
          const fichas = P.areas.reduce((n, a) => n + a.proyectos.length, 0);
          console.log("Taxonomía correcta: 5 áreas y " + fichas + " fichas");
          '

      - name: Verificar que no se publiquen credenciales
        run: |
          set -eu
          # Se excluye .github porque este mismo archivo enumera los patrones.
          # Las plantillas de documentación (`<VAR>`, usuario:clave) no son
          # secretos y se descartan antes de decidir; los formatos
          # criptográficos de token jamás se eximen.
          detectadas=$(grep -rIn --exclude-dir=.git --exclude-dir=.github -E \
            '(mongodb(\+srv)?://[^"[:space:]]*:[^"[:space:]]*@|sk-[A-Za-z0-9]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' . \
            | grep -vE 'mongodb(\+srv)?://[^:]+:<[A-Za-z0-9_]+>@' \
            | grep -vE 'mongodb(\+srv)?://(usuario|user|username):(clave|pass|password|contraseña)@' || true)
          if [ -n "$detectadas" ]; then
            echo "$detectadas"; echo "Se detectaron posibles credenciales"; exit 1
          fi
          echo "Sin credenciales detectadas"

  produccion:
    name: Build de producción (URL de API y artefacto de Gaza)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verificar la configuración de producción
        run: node tools/verificar-config-produccion.mjs

      - name: Comprobar que el manifiesto es válido con configuración saneada
        run: |
          set -eu
          cat > /tmp/despliegue-validacion.env <<'ENV'
          MONGODB_URI=mongodb://usuario:clave@127.0.0.1:27017/validacion?authSource=validacion
          MONGODB_DB=hugo_portfolio_validacion
          ALLOWED_ORIGINS=
          SITE_HOST_PORT=8099
          LOG_LEVEL=info
          ENV
          docker compose -f deploy/docker-compose.yml \
            --env-file /tmp/despliegue-validacion.env config --quiet
          echo "Manifiesto válido"
